
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JUGNO FIGHTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080910;color:white;font-family:Arial;text-align:center}
h1{color:gold;text-shadow:0 0 15px orange;margin:16px 0 5px}
h3{color:#ffc928}
button{border:2px solid gold;background:linear-gradient(135deg,#ffdf43,#b87900);color:#111;font-weight:bold;border-radius:12px;padding:13px;font-size:15px}
button:active{transform:scale(.94)}
#select{padding:12px}
#roster{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:linear-gradient(145deg,#27263c,#10101a);border:2px solid #555;border-radius:12px;padding:12px}
.card.selected{border-color:gold;box-shadow:0 0 15px gold}
.avatar{font-size:48px;margin:8px}
.card b{color:gold}
.card small{display:block;color:#bbb;margin:5px}
#start{margin:16px;width:90%;font-size:19px}
#game{display:none}
.top{display:flex;justify-content:space-around;padding:10px}
.bar{height:17px;background:#444;border:1px solid white;width:42vw}
.hp{height:100%;background:#20e75a;width:100%}
#arena{height:42vh;min-height:260px;position:relative;overflow:hidden;
background:radial-gradient(ellipse at 50% 35%,#67416e,#20152e 65%,#090a12);
border-top:4px solid gold;border-bottom:5px solid gold}
#arena:after{content:"";position:absolute;bottom:0;width:100%;height:22%;background:linear-gradient(#44334a,#17121d);border-top:2px solid #b89b5b}
#fighters{position:absolute;bottom:18%;left:0;width:100%;display:flex;justify-content:space-around;align-items:end;z-index:2}
.fighter{width:90px;transition:transform .15s}
.person{font-size:76px;filter:drop-shadow(0 5px 5px #000);transform:scaleX(-1)}
.enemy .person{transform:scaleX(1)}
.name{color:gold;font-weight:bold;text-shadow:0 2px 5px black}
#message{color:gold;font-size:20px;padding:12px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px}
.controls button{min-height:58px}
#back{margin:8px}
</style>
</head>
<body>
<h1>⚔ JUGNO FIGHTER ⚔</h1>
<div id="select">
<h3>CHOOSE YOUR FIGHTER</h3>
<div id="roster"></div>
<button id="start" onclick="startGame()">START FIGHT 🔥</button>
</div>
<div id="game">
<div class="top">
<div><b id="n1">PLAYER</b><div class="bar"><div class="hp" id="hp1"></div></div></div>
<div><b id="n2">RIVAL</b><div class="bar"><div class="hp" id="hp2"></div></div></div>
</div>
<div id="arena">
<div id="fighters">
<div class="fighter" id="p1"><div class="person" id="face1">🥋</div><div class="name" id="label1"></div></div>
<div class="fighter enemy" id="p2"><div class="person" id="face2">🥊</div><div class="name" id="label2"></div></div>
</div>
</div>
<div id="message">FIGHT! 🔥</div>
<div class="controls">
<button onclick="move(-1)">◀ LEFT</button>
<button onclick="hit(12)">👊 PUNCH</button>
<button onclick="hit(20)">🦵 KICK</button>
<button onclick="move(1)">RIGHT ▶</button>
<button onclick="hit(30)">⚡ SPECIAL</button>
<button onclick="resetFight()">🔄 RESET</button>
</div>
<button id="back" onclick="backToSelect()">CHANGE FIGHTER</button>
</div>
<script>
const roster=[
["ARSLAN","🥋","Karate Master"],
["ALINA","🥷","Speed Fighter"],
["RAIDEN","⚡","Thunder Power"],
["SHADOW","🥷","Ninja Warrior"],
["BLAZE","🔥","Fire Fighter"],
["TITAN","💪","Heavy Champion"],
["VIPER","🐍","Deadly Fighter"],
["KHAN","🛡️","Warrior King"],
["NOVA","🌟","Energy Master"],
["FALCON","🦅","Sky Fighter"]
];
let chosen=0,enemy=1,h1=100,h2=100,x=0,playing=false;
const rosterBox=document.getElementById("roster");
function drawRoster(){
rosterBox.innerHTML="";
roster.forEach((f,i)=>{
let c=document.createElement("div");
c.className="card"+(i===chosen?" selected":"");
c.innerHTML='<div class="avatar">'+f[1]+'</div><b>'+f[0]+'</b><small>'+f[2]+'</small>';
c.onclick=()=>{chosen=i;drawRoster()};
rosterBox.appendChild(c);
});
}
function startGame(){
enemy=(chosen+1)%roster.length;
document.getElementById("select").style.display="none";
document.getElementById("game").style.display="block";
document.getElementById("n1").innerText=roster[chosen][0];
document.getElementById("n2").innerText=roster[enemy][0];
document.getElementById("label1").innerText=roster[chosen][0];
document.getElementById("label2").innerText=roster[enemy][0];
document.getElementById("face1").innerText=roster[chosen][1];
document.getElementById("face2").innerText=roster[enemy][1];
resetFight();
}
function render(){
document.getElementById("hp1").style.width=h1+"%";
document.getElementById("hp2").style.width=h2+"%";
document.getElementById("p1").style.transform="translateX("+x+"px)";
}
function move(d){
if(!playing)return;
x=Math.max(-35,Math.min(90,x+d*18));
render();
}
function hit(d){
if(!playing)return;
if(Math.abs(x)<105){
h2=Math.max(0,h2-d);
document.getElementById("message").innerText=d===30?"⚡ SPECIAL POWER!":d===20?"🦵 POWER KICK!":"👊 PUNCH HIT!";
document.getElementById("p1").style.transform="translateX("+x+"px) scale(1.12)";
setTimeout(render,130);
if(h2===0){playing=false;document.getElementById("message").innerText="🏆 YOU WIN!";}
}else{
document.getElementById("message").innerText="GET CLOSER!";
}
render();
}
function resetFight(){
h1=100;h2=100;x=0;playing=true;
document.getElementById("message").innerText="FIGHT! 🔥";
render();
}
function backToSelect(){
playing=false;
document.getElementById("game").style.display="none";
document.getElementById("select").style.display="block";
}
drawRoster();
</script>
</body>
</html>

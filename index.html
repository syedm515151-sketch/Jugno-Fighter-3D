
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUGNO FIGHTER 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial;text-align:center;overflow:hidden}
h2{color:gold;margin:12px}
#arena{height:55vh;position:relative;overflow:hidden;
background:linear-gradient(#17102d,#512c22 65%,#171717);
border-bottom:5px solid gold}
#arena:before{content:"JUGNO FIGHTER";position:absolute;top:35%;left:0;right:0;
font-size:clamp(30px,8vw,65px);font-weight:bold;color:#ffffff18}
.fighter{position:absolute;bottom:30px;width:65px;height:140px;transition:left .12s}
.head{width:42px;height:42px;background:#e6a46e;border-radius:50%;margin:auto}
.body{width:48px;height:65px;background:gold;margin:auto;border-radius:12px}
.legs{display:flex;justify-content:center;gap:12px}
.legs span{width:15px;height:40px;background:#ddd;border-radius:8px}
#p1{left:15%}#p2{left:70%}
#p2 .body{background:#d32f2f}
.bar{height:17px;background:#444;margin:5px;border:1px solid white}
.health{height:100%;background:#23e65b;width:100%;transition:width .2s}
#controls{display:flex;justify-content:space-around;gap:8px;padding:12px;flex-wrap:wrap}
button{background:#d6a500;color:black;border:2px solid white;
border-radius:12px;padding:17px 19px;font-weight:bold;font-size:17px}
button:active{background:white}
#message{color:gold;font-size:20px;margin:8px}
</style>
</head>
<body>
<h2>⚔ JUGNO FIGHTER 3D ⚔</h2>
<div style="display:flex;justify-content:space-around">
<div style="width:45%">PLAYER 1<div class="bar"><div id="hp1" class="health"></div></div></div>
<div style="width:45%">PLAYER 2<div class="bar"><div id="hp2" class="health"></div></div></div>
</div>
<div id="arena">
<div class="fighter" id="p1">
<div class="head"></div><div class="body"></div>
<div class="legs"><span></span><span></span></div>
</div>
<div class="fighter" id="p2">
<div class="head"></div><div class="body"></div>
<div class="legs"><span></span><span></span></div>
</div>
</div>
<div id="message">FIGHT! 🔥</div>
<div id="controls">
<button onclick="move(-1)">◀ MOVE</button>
<button onclick="attack(12)">👊 PUNCH</button>
<button onclick="attack(20)">🦵 KICK</button>
<button onclick="move(1)">MOVE ▶</button>
<button onclick="restart()">🔄 RESET</button>
</div>
<script>
let x1=15,x2=70,h1=100,h2=100,playing=true;
const p1=document.getElementById('p1');
const p2=document.getElementById('p2');
function render(){
p1.style.left=x1+'%';p2.style.left=x2+'%';
document.getElementById('hp1').style.width=h1+'%';
document.getElementById('hp2').style.width=h2+'%';
}
function move(dir){
if(!playing)return;
x1=Math.max(2,Math.min(85,x1+dir*5));
render();
}
function attack(damage){
if(!playing)return;
if(Math.abs(x2-x1)<32){
h2=Math.max(0,h2-damage);
document.getElementById('message').innerText=
damage===20?'POWER KICK! 🔥':'PUNCH HIT! 👊';
if(h2===0){playing=false;document.getElementById('message').innerText='🏆 PLAYER 1 WINS!';}
}else{
document.getElementById('message').innerText='GET CLOSER!';
}
render();
}
function restart(){
x1=15;x2=70;h1=100;h2=100;playing=true;
document.getElementById('message').innerText='FIGHT! 🔥';
render();
}
render();
</script>
</body>
</html>

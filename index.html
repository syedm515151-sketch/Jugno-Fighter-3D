
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUGNO FIGHTER 3D V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080810;color:white;font-family:Arial;text-align:center}
h1{color:gold}
#menu{padding:12px}
#players{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:#202033;border:2px solid #777;padding:12px;border-radius:12px}
.card.selected{border-color:gold}
.card div{font-size:38px}
button{background:linear-gradient(120deg,#ffe45c,#bd7900);border:0;border-radius:10px;padding:13px;font-weight:bold;margin:5px}
#start{width:90%;font-size:18px}
#game{display:none}
#view{height:55vh;min-height:280px;width:100%;display:block}
#status{color:gold;padding:8px}
.controls{display:flex;justify-content:center;flex-wrap:wrap}
#hp{width:85%;height:16px;background:#555;margin:auto}
#health{height:100%;width:100%;background:#20e65c}
</style>
</head>
<body>
<h1>⚔ JUGNO FIGHTER 3D ⚔</h1>
<div id="menu">
<h3>SELECT YOUR FIGHTER</h3>
<div id="players"></div>
<button id="start" onclick="startGame()">START FIGHT 🔥</button>
</div>
<div id="game">
<div id="hp"><div id="health"></div></div>
<div id="status">FIGHT!</div>
<canvas id="view"></canvas>
<div class="controls">
<button onclick="move(-1)">◀ LEFT</button>
<button onclick="attack(10)">👊 PUNCH</button>
<button onclick="attack(18)">🦵 KICK</button>
<button onclick="attack(30)">⚡ POWER</button>
<button onclick="move(1)">RIGHT ▶</button>
</div>
<button onclick="location.reload()">BACK / RESET</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const fighters=[
["ARSLAN","🥋"],["ALINA","🥷"],
["RAIDEN","⚡"],["SHADOW","🥷"],
["BLAZE","🔥"],["TITAN","💪"],
["VIPER","🐍"],["KHAN","🛡️"],
["NOVA","🌟"],["FALCON","🦅"]
];
let selected=0,scene,camera,renderer,player,enemy;
let health=100,position=0,playing=false;
const players=document.getElementById("players");
fighters.forEach((f,i)=>{
let el=document.createElement("div");
el.className="card"+(i===0?" selected":"");
el.innerHTML="<div>"+f[1]+"</div><b>"+f[0]+"</b>";
el.onclick=()=>{
selected=i;
document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
el.classList.add("selected");
};
players.appendChild(el);
});
function makeFighter(x,color){
let group=new THREE.Group();
const mat=new THREE.MeshStandardMaterial({color});
function part(w,h,d,y,material){
let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
m.position.y=y;group.add(m);return m;
}
part(.75,1.05,.4,1.45,mat);
let skin=new THREE.MeshStandardMaterial({color:0xd9a078});
let head=new THREE.Mesh(new THREE.SphereGeometry(.34,20,20),skin);
head.position.y=2.25;group.add(head);
let arm1=part(.23,.9,.25,1.45,skin);
arm1.position.x=-.53;arm1.rotation.z=-.3;
let arm2=part(.23,.9,.25,1.45,skin);
arm2.position.x=.53;arm2.rotation.z=.3;
let leg1=part(.3,.9,.32,.48,mat);
leg1.position.x=-.23;
let leg2=part(.3,.9,.32,.48,mat);
leg2.position.x=.23;
group.position.x=x;scene.add(group);
return group;
}
function startGame(){
if(!window.THREE){
alert("Internet connection required to load 3D engine");
return;
}
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
health=100;position=0;playing=true;
scene=new THREE.Scene();
scene.background=new THREE.Color(0x17132d);
camera=new THREE.PerspectiveCamera(50,1,.1,100);
camera.position.set(0,4.5,9);
camera.lookAt(0,1,0);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById("view"),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.HemisphereLight(0xffffff,0x444466,2));
let light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(3,8,5);scene.add(light);
let floor=new THREE.Mesh(new THREE.BoxGeometry(12,.3,9),new THREE.MeshStandardMaterial({color:0x383342}));
floor.position.y=-.2;scene.add(floor);
for(let i=0;i<4;i++){
let pillar=new THREE.Mesh(new THREE.BoxGeometry(.35,4,.35),new THREE.MeshStandardMaterial({color:0xffb800}));
pillar.position.set(i<2?-5:5,1.8,i%2? -3:3);scene.add(pillar);
}
player=makeFighter(-2,0xe3aa19);
enemy=makeFighter(2,0xb52235);
enemy.rotation.y=Math.PI;
resize();
window.onresize=resize;
animate();
document.getElementById("status").innerText=fighters[selected][0]+" VS "+fighters[(selected+1)%10][0];
}
function resize(){
if(!renderer)return;
let c=document.getElementById("view");
renderer.setSize(c.clientWidth,c.clientHeight,false);
camera.aspect=c.clientWidth/c.clientHeight;
camera.updateProjectionMatrix();
}
function animate(){
if(!playing)return;
requestAnimationFrame(animate);
if(enemy&&Math.random()<.01)enemy.position.x=2+(Math.random()-.5)*.7;
renderer.render(scene,camera);
}
function move(d){
if(!playing)return;
position=Math.max(-1.4,Math.min(1.4,position+d*.3));
player.position.x=-2+position;
}
function attack(d){
if(!playing)return;
if(Math.abs(player.position.x-enemy.position.x)<3.8){
health=Math.max(0,health-d);
document.getElementById("health").style.width=health+"%";
document.getElementById("status").innerText=d===30?"SPECIAL POWER! ⚡":"HIT! 🔥";
enemy.rotation.y+=.25;
if(health===0){
playing=false;
document.getElementById("status").innerText="🏆 YOU WIN!";
}
}else{
document.getElementById("status").innerText="MOVE CLOSER!";
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>JUGNO FIGHTER 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:0;right:0;padding:10px;display:flex;gap:10px;justify-content:space-between;align-items:center;pointer-events:none}
.panel{background:#090909cc;border:1px solid #b58b27;border-radius:10px;padding:8px 10px;min-width:35%;box-shadow:0 0 14px #000}
.name{font-size:12px;color:#f4cf68;margin-bottom:5px}.bar{height:12px;background:#452020;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#e32e22,#ffb52e);transition:width .15s}
#title{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#f5cd62;font-weight:900;letter-spacing:2px;text-shadow:0 2px 8px #000;white-space:nowrap}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;padding:18px}
#card{width:min(420px,100%);background:#111e;border:1px solid #b58b27;border-radius:18px;padding:20px;text-align:center;box-shadow:0 10px 50px #000}
h1{margin:0 0 8px;color:#f5cd62;font-size:25px}p{color:#ddd;font-size:13px}
select,button{font-size:16px;border-radius:10px;border:1px solid #b58b27;padding:12px;background:#181818;color:#fff}
select{width:100%;margin:8px 0 12px}button{background:linear-gradient(135deg,#d6a638,#805514);color:#080808;font-weight:bold;cursor:pointer}
#start{width:100%}#status{min-height:20px;color:#f5cd62;font-size:13px}
#controls{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
.pad,.attacks{display:flex;gap:9px;align-items:end;pointer-events:auto}
.ctrl{width:58px;height:58px;border-radius:50%;background:#111c;border:1px solid #d5ad4b;color:#fff;font-size:22px;touch-action:none;user-select:none}
.ctrl.attack{background:#8b2020cc;border-color:#ff8b5c;font-size:13px;width:64px;height:64px}
#restart{position:absolute;right:12px;top:76px;padding:8px 11px;font-size:12px}
#hint{position:absolute;bottom:90px;left:0;right:0;text-align:center;font-size:11px;color:#fff9;pointer-events:none}
.hidden{display:none!important}
@media(max-width:420px){#title{top:66px;font-size:13px}.panel{min-width:38%;padding:6px}.ctrl{width:52px;height:52px}.ctrl.attack{width:58px;height:58px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div class="panel"><div class="name" id="pname">PLAYER</div><div class="bar"><div class="fill" id="php"></div></div></div><div id="title">JUGNO FIGHTER 3D</div><div class="panel"><div class="name" id="ename">RIVAL</div><div class="bar"><div class="fill" id="ehp"></div></div></div></div>
<button id="restart" class="hidden">RESTART</button>
<div id="hint">Move: ◀ ▶ ▲ ▼ &nbsp; • &nbsp; Punch / Kick</div>
<div id="controls" class="hidden"><div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="attacks"><button class="ctrl" data-key="up">↑</button><button class="ctrl attack" data-key="punch">PUNCH</button><button class="ctrl attack" data-key="kick">KICK</button></div></div>
<div id="menu"><div id="card"><h1>JUGNO FIGHTER 3D</h1><p>Choose your fighter and defeat the CPU rival.</p><select id="fighter"><option value="0">Shadow Warrior</option><option value="1">Golden Tiger</option><option value="2">Cyber Ninja</option><option value="3">Fire Knight</option><option value="4">Ice Wolf</option><option value="5">Storm Master</option><option value="6">Dark Sultan</option><option value="7">Red Dragon</option><option value="8">Steel Phantom</option><option value="9">Desert King</option></select><button id="start">START FIGHT</button><p id="status">10 fighters • 3D arena • Mobile controls</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game'),menu=document.querySelector('#menu'),controls=document.querySelector('#controls');
const colors=[0x24243a,0xc28b20,0x15a7a0,0x9d2828,0x8bd9ef,0x5969dc,0x4b245f,0xc43a22,0x8a9aa8,0x967044];
const names=['Shadow Warrior','Golden Tiger','Cyber Ninja','Fire Knight','Ice Wolf','Storm Master','Dark Sultan','Red Dragon','Steel Phantom','Desert King'];
let scene,camera,renderer,clock,player,enemy,active=false,over=false,pHealth=100,eHealth=100,keys={},cooldown=0,enemyCooldown=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fighter(color,x){const root=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.18});const dark=new THREE.MeshStandardMaterial({color:0x171717,roughness:.7});const skin=new THREE.MeshStandardMaterial({color:0xc58c65});
function part(geo,m,pos){const o=new THREE.Mesh(geo,m);o.position.set(...pos);o.castShadow=true;root.add(o);return o}
part(new THREE.CylinderGeometry(.34,.42,.95,12),mat,[0,1.25,0]);
part(new THREE.SphereGeometry(.3,16,12),skin,[0,2,0]);
part(new THREE.ConeGeometry(.32,.34,8),mat,[0,2.36,0]);
const arms=[],legs=[];
for(const s of [-1,1]){const a=part(new THREE.CapsuleGeometry(.12,.52,4,8),mat,[s*.48,1.35,0]);a.rotation.z=s*-.22;arms.push(a);const l=part(new THREE.CapsuleGeometry(.14,.58,4,8),dark,[s*.2,.48,0]);legs.push(l);part(new THREE.BoxGeometry(.28,.16,.42),dark,[s*.2,.13,.1]);}
part(new THREE.BoxGeometry(.78,.16,.42),dark,[0,.85,0]);
root.position.set(x,0,0);root.userData={arms,legs,baseX:x,hit:0};scene.add(root);return root}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x090b19);scene.fog=new THREE.Fog(0x090b19,13,28);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,5.5,11);camera.lookAt(0,1,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8caff,0x342016,2));const light=new THREE.DirectionalLight(0xffe0a0,2.4);light.position.set(-4,9,6);light.castShadow=true;scene.add(light);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(7,7,.25,64),new THREE.MeshStandardMaterial({color:0x25212a,metalness:.4,roughness:.65}));floor.position.y=-.15;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(6.4,.055,8,80),new THREE.MeshBasicMaterial({color:0xc99b36}));ring.rotation.x=Math.PI/2;ring.position.y=.02;scene.add(ring);
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,2.7,8),new THREE.MeshStandardMaterial({color:0x57401c,metalness:.7}));pillar.position.set(Math.cos(a)*7,1.2,Math.sin(a)*7);scene.add(pillar)}
clock=new THREE.Clock();window.addEventListener('resize',resize);animate()}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function start(){if(!renderer)init();if(player)scene.remove(player);if(enemy)scene.remove(enemy);const idx=+document.querySelector('#fighter').value;player=fighter(colors[idx],-2);enemy=fighter(colors[(idx+3)%10],2);enemy.rotation.y=Math.PI;pHealth=eHealth=100;active=true;over=false;menu.classList.add('hidden');controls.classList.remove('hidden');document.querySelector('#restart').classList.remove('hidden');document.querySelector('#pname').textContent=names[idx];document.querySelector('#ename').textContent=names[(idx+3)%10];document.querySelector('#status').textContent='Fight!';}
function updateBars(){document.querySelector('#php').style.width=pHealth+'%';document.querySelector('#ehp').style.width=eHealth+'%'}
function hit(attacker,target,damage){if(!active||over)return;const d=attacker.position.distanceTo(target.position);if(d<2.15){if(target===enemy)eHealth=Math.max(0,eHealth-damage);else pHealth=Math.max(0,pHealth-damage);target.userData.hit=.22;updateBars();if(eHealth<=0||pHealth<=0){over=true;document.querySelector('#status').textContent=eHealth<=0?'YOU WIN! 🏆':'CPU WINS — TRY AGAIN';menu.classList.remove('hidden');}}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(active&&!over){cooldown-=dt;enemyCooldown-=dt;let dx=0,dz=0;if(keys.left)dx-=1;if(keys.right)dx+=1;if(keys.up)dz-=1;if(keys.down)dz+=1;player.position.x=clamp(player.position.x+dx*dt*4.1,-5.2,5.2);player.position.z=clamp(player.position.z+dz*dt*3,-2.6,2.6);player.rotation.y=enemy.position.x>player.position.x?Math.PI/2:-Math.PI/2;
const dist=player.position.distanceTo(enemy.position);if(dist>1.55){enemy.position.x+=Math.sign(player.position.x-enemy.position.x)*dt*1.35;enemy.position.z+=Math.sign(player.position.z-enemy.position.z)*dt*.6;}else if(enemyCooldown<=0){hit(enemy,player,7+Math.random()*5);enemyCooldown=1.05;}
for(const f of [player,enemy]){f.userData.hit=Math.max(0,f.userData.hit-dt);f.position.y=f.userData.hit>0?Math.sin(f.userData.hit*14)*.09:0;f.userData.arms.forEach((a,i)=>{a.rotation.x=f.userData.hit>0?-.9:Math.sin(clock.elapsedTime*5+i)*.08});}
camera.position.x+=(player.position.x*.18-camera.position.x)*dt;camera.lookAt(0,1,0)}
renderer.render(scene,camera)}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',start);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true;if((k==='punch'||k==='kick')&&cooldown<=0){hit(player,enemy,k==='kick'?15:10);cooldown=.38}};const up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(map[e.key])keys[map[e.key]]=true;if(e.key==='j'||e.key===' ')if(cooldown<=0){hit(player,enemy,10);cooldown=.38}if(e.key==='k'&&cooldown<=0){hit(player,enemy,15);cooldown=.45}});
window.addEventListener('keyup',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(map[e.key])keys[map[e.key]]=false});
init();
</script>
</body>
</html>

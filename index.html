<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09070d"><title>JUGNO FIGHTER 3D</title>
<style>
:root{--gold:#f5c451;--red:#ff414d;--cyan:#45d9ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#game{position:fixed;inset:0}#hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;gap:10px}.fighter{width:42%;max-width:440px}.name{font-weight:900;letter-spacing:1px;text-shadow:0 2px 5px #000;font-size:clamp(12px,2.8vw,19px)}.bar{height:14px;border:2px solid #fff9;background:#17131d;border-radius:10px;overflow:hidden;margin-top:5px;box-shadow:0 2px 9px #000}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ffe27a,#d98c1d);transition:width .15s}.enemy .fill{background:linear-gradient(90deg,#ffb0a9,#d21f39)}#timer{font-size:clamp(24px,5vw,38px);font-weight:900;color:var(--gold);text-shadow:0 2px 8px #000}.sub{font-size:10px;color:#ddd;margin-top:3px}#center{position:absolute;top:17%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(22px,6vw,54px);color:var(--gold);text-shadow:0 4px 10px #000;white-space:nowrap;text-align:center}#message{font-size:clamp(11px,2.3vw,16px);color:#fff;letter-spacing:2px}#controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,50px);gap:5px}.actions{display:grid;grid-template-columns:repeat(2,64px);gap:8px}.ctrl{border:1px solid #ffffff55;background:linear-gradient(145deg,#282332dd,#09080ddd);color:white;border-radius:15px;font-weight:900;font-size:12px;box-shadow:0 4px 12px #0009;touch-action:none;user-select:none}.ctrl:active,.ctrl.active{background:linear-gradient(145deg,#b27c22,#5b3511);border-color:var(--gold)}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions .ctrl{height:54px}.special{grid-column:span 2;color:var(--gold);border-color:#c99b3d}#overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,#21192aee,#07060bf5);display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:auto;overflow:auto}#panel{width:min(720px,100%);text-align:center;border:1px solid #b98a36;border-radius:20px;padding:22px 16px;background:#100d17ee;box-shadow:0 0 45px #000}h1{margin:0;color:var(--gold);font-size:clamp(28px,7vw,54px);letter-spacing:2px;text-shadow:0 0 20px #a66b20}#tag{color:#c8bda9;margin:7px 0 16px;font-size:12px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pick{min-height:72px;border:1px solid #55452e;border-radius:12px;background:#1b1722;color:#fff;font-size:11px;font-weight:bold;padding:7px 3px}.pick b{display:block;font-size:22px;margin-bottom:5px}.pick.sel{border:2px solid var(--gold);background:#3b2b18}.mainbtn{margin-top:16px;padding:14px 30px;border:0;border-radius:30px;background:linear-gradient(90deg,#f7d16d,#b8791c);font-weight:900;font-size:16px;color:#160e04}.hint{font-size:11px;color:#aaa;margin-top:12px;line-height:1.5}#pause{position:absolute;right:12px;top:82px;pointer-events:auto;padding:8px 12px;border-radius:10px;background:#17131ddd;color:#fff;border:1px solid #fff5}#round{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000;white-space:nowrap}
@media(max-width:420px){.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px)}.actions{grid-template-columns:repeat(2,57px)}.actions .ctrl{height:49px}.ctrl{border-radius:12px}.top{padding:9px}.bar{height:12px}.grid{gap:5px}.pick{min-height:65px;font-size:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body><div id="game"></div><div id="hud">
<div class="top"><div class="fighter"><div class="name" id="pname">JUGNO WARRIOR</div><div class="bar"><div class="fill" id="php"></div></div><div class="sub">PLAYER 1 · POWER <span id="ppower">READY</span></div></div><div id="timer">99</div><div class="fighter enemy" style="text-align:right"><div class="name" id="ename">SHADOW RIVAL</div><div class="bar"><div class="fill" id="ehp"></div></div><div class="sub">CPU · <span id="epower">FIGHTER</span></div></div></div>
<div id="center">JUGNO FIGHTER 3D<div id="message">CHOOSE YOUR FIGHTER</div></div><div id="round">ROUND 1</div>
<div id="controls"><div class="pad"><button class="ctrl up" data-key="forward">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="back">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="actions"><button class="ctrl" data-key="punch">PUNCH</button><button class="ctrl" data-key="kick">KICK</button><button class="ctrl special" data-key="special">⚡ SPECIAL POWER</button></div></div>
<button id="pause">Ⅱ PAUSE</button></div>
<div id="overlay"><div id="panel"><h1>JUGNO FIGHTER 3D</h1><div id="tag">THE ULTIMATE WARRIOR ARENA</div><p>SELECT YOUR FIGHTER</p><div class="grid" id="roster"></div><button class="mainbtn" id="start">START FIGHT</button><div class="hint">Touch controls supported · Landscape mode recommended<br>Original fan-made fighting game project</div></div></div>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const roster=[
{name:'ARSLAN',title:'THE EMPEROR',color:0xd6a52e,glow:0xffc84b,power:'ROYAL BLAST',mark:'♛'},
{name:'SHADOW WARRIOR',title:'NIGHT STALKER',color:0x423c66,glow:0x9b70ff,power:'DARK ORB',mark:'☠'},
{name:'GOLDEN TIGER',title:'ARENA KING',color:0xd18b20,glow:0xffd65c,power:'TIGER FLAME',mark:'🐅'},
{name:'CYBER NINJA',title:'NEON ASSASSIN',color:0x167e91,glow:0x45eaff,power:'PLASMA SHOT',mark:'忍'},
{name:'FIRE KNIGHT',title:'BLAZE LORD',color:0x9d2a21,glow:0xff5b27,power:'FIRE STORM',mark:'火'},
{name:'ICE WOLF',title:'FROST BORN',color:0x477caa,glow:0x91e8ff,power:'ICE SPEAR',mark:'❄'},
{name:'STORM MASTER',title:'THUNDER GOD',color:0x6552a1,glow:0xd2a4ff,power:'THUNDER BOLT',mark:'⚡'},
{name:'DARK SULTAN',title:'DESERT CURSE',color:0x4d342a,glow:0xff9c43,power:'SAND VORTEX',mark:'☾'},
{name:'RED DRAGON',title:'BLOOD FURY',color:0x9e2339,glow:0xff456b,power:'DRAGON ROAR',mark:'龍'},
{name:'STEEL PHANTOM',title:'IRON GHOST',color:0x69727c,glow:0xb8e0ef,power:'SONIC WAVE',mark:'✦'}
];
let selected=0,player,enemy,active=false,paused=false,time=99,last=0,round=1,keys={},scene,camera,renderer,clock,projectiles=[],particles=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makeFighter(data,x,isCPU=false){
 const root=new THREE.Group();root.position.set(x,0,0);scene.add(root);
 const mat=new THREE.MeshStandardMaterial({color:data.color,roughness:.55,metalness:.22});
 const dark=new THREE.MeshStandardMaterial({color:0x17151c,roughness:.8});
 const gold=new THREE.MeshStandardMaterial({color:data.glow,emissive:data.glow,emissiveIntensity:.18,metalness:.5});
 const sphere=(r,m,pos,scale)=>{let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(...pos);if(scale)o.scale.set(...scale);root.add(o);return o};
 const limb=(a,b,r1,r2,m)=>{let d=new THREE.Vector3().subVectors(new THREE.Vector3(...b),new THREE.Vector3(...a));let o=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),10),m);o.position.copy(new THREE.Vector3(...a).add(new THREE.Vector3(...b)).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());root.add(o);return o};
 sphere(.34,mat,[0,1.25,0],[.8,1.25,.6]);sphere(.22,mat,[0,1.82,0],[.9,1.05,.9]);
 sphere(.23,dark,[0,1.91,.04],[1,.42,.95]);sphere(.045,gold,[0,1.83,.25],[2.2,.5,.4]);
 limb([-.18,1.1,0],[-.23,.63,0],.13,.1,mat);limb([.18,1.1,0],[.23,.63,0],.13,.1,mat);
 limb([-.23,.63,0],[-.25,.12,.06],.1,.08,dark);limb([.23,.63,0],[.25,.12,.06],.1,.08,dark);
 sphere(.13,mat,[-.25,.09,.12],[1.4,.55,1.8]);sphere(.13,mat,[.25,.09,.12],[1.4,.55,1.8]);
 limb([-.28,1.5,0],[-.55,1.12,.08],.12,.09,mat);limb([.28,1.5,0],[.55,1.12,.08],.12,.09,mat);
 limb([-.55,1.12,.08],[-.48,.83,.28],.09,.075,mat);limb([.55,1.12,.08],[.48,.83,.28],.09,.075,mat);
 sphere(.12,gold,[-.48,.81,.29]);sphere(.12,gold,[.48,.81,.29]);
 // shoulder armor, belt, distinctive crest
 sphere(.19,gold,[-.3,1.48,0],[1,.8,.8]);sphere(.19,gold,[.3,1.48,0],[1,.8,.8]);
 let belt=new THREE.Mesh(new THREE.BoxGeometry(.52,.12,.48),gold);belt.position.y=1.02;root.add(belt);
 let crest=new THREE.Mesh(new THREE.ConeGeometry(.16,.34,5),gold);crest.position.set(0,2.12,0);root.add(crest);
 const aura=new THREE.PointLight(data.glow,1.3,2.4);aura.position.set(0,1.1,0);root.add(aura);
 root.userData={hp:100,max:100,stun:0,attack:0,cool:0,special:0,root,mat,glow:data.glow,data,isCPU};
 return root;
}
function setup(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x100c18);scene.fog=new THREE.Fog(0x100c18,13,32);
 camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,5.2,11.8);camera.lookAt(0,1,0);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xb7caff,0x241323,2));
 let key=new THREE.DirectionalLight(0xffd79a,3);key.position.set(-4,9,6);key.castShadow=true;scene.add(key);
 for(let i=0;i<4;i++){let l=new THREE.PointLight(i%2?0x4a7dff:0xff8a35,18,10);l.position.set(i<2?-5:5,3,i%2?-3:3);scene.add(l)}
 const floor=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.2,.35,64),new THREE.MeshStandardMaterial({color:0x29212c,metalness:.45,roughness:.7}));floor.position.y=-.2;floor.receiveShadow=true;scene.add(floor);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(5.7,.08,8,90),new THREE.MeshStandardMaterial({color:0xd99a37,emissive:0x8b4c12,emissiveIntensity:.8}));ring.rotation.x=Math.PI/2;ring.position.y=.01;scene.add(ring);
 for(let i=0;i<16;i++){let a=i*Math.PI/8;let pillar=new THREE.Mesh(new THREE.CylinderGeometry(.16,.25,3.8,8),new THREE.MeshStandardMaterial({color:0x44334b,metalness:.5}));pillar.position.set(Math.cos(a)*7,1.7,Math.sin(a)*5);scene.add(pillar);let orb=new THREE.PointLight(0xffa83d,3,3);orb.position.set(Math.cos(a)*7,3.6,Math.sin(a)*5);scene.add(orb)}
 const wall=new THREE.Mesh(new THREE.CylinderGeometry(8,8,5,48,1,true),new THREE.MeshStandardMaterial({color:0x171322,side:THREE.BackSide,roughness:1}));wall.position.y=1;scene.add(wall);
 clock=new THREE.Clock();window.addEventListener('resize',resize);animate();
}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function rosterUI(){ $('roster').innerHTML='';roster.forEach((f,i)=>{let b=document.createElement('button');b.className='pick'+(i===selected?' sel':'');b.innerHTML='<b style="color:#'+f.glow.toString(16).padStart(6,'0')+'">'+f.mark+'</b>'+f.name;b.onclick=()=>{selected=i;rosterUI()};$('roster').appendChild(b)})}
function start(){if(player)scene.remove(player);if(enemy)scene.remove(enemy);projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];player=makeFighter(roster[selected],-1.65);enemy=makeFighter(roster[(selected+1+Math.floor(Math.random()*9))%10],1.65,true);player.rotation.y=.25;enemy.rotation.y=Math.PI-.25;player.userData.hp=100;enemy.userData.hp=100;time=99;round=1;active=true;paused=false;$('overlay').style.display='none';$('center').innerHTML='FIGHT!<div id="message">FIRST TO WIN TWO ROUNDS</div>';setTimeout(()=>$('center').style.opacity='0',1200);$('round').textContent='ROUND '+round;updateHUD()}
function updateHUD(){$('pname').textContent=roster[selected].name;$('ename').textContent=enemy?.userData.data.name||'RIVAL';$('php').style.width=(player?.userData.hp||100)+'%';$('ehp').style.width=(enemy?.userData.hp||100)+'%';$('timer').textContent=Math.ceil(time);$('ppower').textContent=player?.userData.special>0?'CHARGING':'READY';$('epower').textContent=enemy?.userData.data.title||'CPU'}
function burst(pos,color,count=14){for(let i=0;i<count;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);particles.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*4,Math.random()*3,(Math.random()-.5)*2),life:.55})}}
function attack(who,type){if(!active||paused||who.userData.stun>0||who.userData.cool>0)return;let other=who===player?enemy:player,d=other.position.x-who.position.x,dist=Math.abs(d);who.userData.attack=.28;who.userData.cool=type==='special'?1.2:.42;
 if(type==='special'){who.userData.special=0;let geom=new THREE.IcosahedronGeometry(.28,1),mat=new THREE.MeshStandardMaterial({color:who.userData.glow,emissive:who.userData.glow,emissiveIntensity:2});let mesh=new THREE.Mesh(geom,mat);mesh.position.set(who.position.x,1.25,.4);scene.add(mesh);projectiles.push({mesh,dir:Math.sign(d),owner:who,life:2,damage:24});burst(mesh.position,who.userData.glow,20);return}
 if(dist<1.65){let dmg=type==='kick'?11:7;other.userData.hp=clamp(other.userData.hp-dmg,0,100);other.userData.stun=.18;other.position.x+=Math.sign(d)*.28;burst(new THREE.Vector3(other.position.x,1.2,.35),0xffd27a,9);if(other.userData.hp<=0)finish(who)}
}
function finish(winner){if(!active)return;active=false;$('center').style.opacity='1';$('center').innerHTML=(winner===player?'YOU WIN!':'K.O.!')+'<div id="message">TAP START TO FIGHT AGAIN</div>';$('overlay').style.display='flex';$('panel').innerHTML='<h1>'+(winner===player?'VICTORY':'DEFEAT')+'</h1><div id="tag">'+(winner===player?'THE ARENA IS YOURS':'TRAIN AND RETURN, WARRIOR')+'</div><button class="mainbtn" id="again">REMATCH</button><div class="hint">Choose another fighter from the roster</div>'; $('again').onclick=()=>{location.reload()}}
function movement(dt){if(!player||!enemy)return;let p=player.userData,e=enemy.userData;
 p.cool=Math.max(0,p.cool-dt);p.stun=Math.max(0,p.stun-dt);e.cool=Math.max(0,e.cool-dt);e.stun=Math.max(0,e.stun-dt);
 if(p.stun<=0){if(keys.left)player.position.x-=2.5*dt;if(keys.right)player.position.x+=2.5*dt;if(keys.forward)player.position.z-=1.4*dt;if(keys.back)player.position.z+=1.4*dt;if(keys.punch)attack(player,'punch');if(keys.kick)attack(player,'kick');if(keys.special)attack(player,'special')}
 player.position.x=clamp(player.position.x,-4.4,4.4);player.position.z=clamp(player.position.z,-1.6,1.6);
 let dx=player.position.x-enemy.position.x,dist=Math.abs(dx);enemy.rotation.y=dx>0?0:Math.PI;player.rotation.y=dx<0?0:Math.PI;
 if(e.stun<=0){if(dist>1.35)enemy.position.x+=Math.sign(dx)*1.25*dt;else if(Math.random()<dt*1.7)attack(enemy,Math.random()<.55?'punch':'kick');if(dist<1.55&&Math.random()<dt*.45)attack(enemy,'special')}
 for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.mesh.position.x+=p.dir*7*dt;p.life-=dt;if(Math.abs(p.mesh.position.x-(p.owner===player?enemy.position.x:player.position.x))<.55&&Math.abs(p.mesh.position.z)<1){let target=p.owner===player?enemy:player;target.userData.hp=clamp(target.userData.hp-p.damage,0,100);target.userData.stun=.4;burst(p.mesh.position,p.owner.userData.glow,18);if(target.userData.hp<=0)finish(p.owner);p.life=0}if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1)}}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.mesh.position.addScaledVector(p.v,dt);p.v.y-=5*dt;p.mesh.scale.setScalar(Math.max(.01,p.life*1.7));if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1)}}
 time-=dt;if(time<=0){finish(player.userData.hp>=enemy.userData.hp?player:enemy)}updateHUD();
}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(active&&!paused)movement(dt);if(player&&enemy){let mid=(player.position.x+enemy.position.x)/2;camera.position.x+=(mid-camera.position.x)*dt*.7;camera.lookAt(mid,.95,0);[player,enemy].forEach((f,i)=>{let u=f.userData;f.position.y=Math.abs(Math.sin(performance.now()*.006+i))*0.035;if(u.attack>0){u.attack-=dt;f.rotation.z=Math.sin(u.attack*18)*.08}else f.rotation.z*=.85})}renderer.render(scene,camera)}
setup();rosterUI();$('start').onclick=start;
function setKey(k,v){keys[k]=v;document.querySelectorAll('[data-key="'+k+'"]').forEach(b=>b.classList.toggle('active',v))}
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setKey(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)))});
window.addEventListener('keydown',e=>{let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',j:'punch',k:'kick',l:'special'};if(map[e.key]){e.preventDefault();setKey(map[e.key],true)}});window.addEventListener('keyup',e=>{let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',j:'punch',k:'kick',l:'special'};if(map[e.key])setKey(map[e.key],false)});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';$('center').style.opacity=paused?'1':'0';if(paused)$('center').innerHTML='PAUSED<div id="message">PRESS RESUME TO CONTINUE</div>'};
</script></body></html>
